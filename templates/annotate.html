<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据标注 - YOLO 学习平台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; background: #f5f6fa; color: #222; }
  header { background: #1a1c2e; color: #fff; padding: 12px 20px; display: flex;
           justify-content: space-between; align-items: center; }
  header a { color: #9db4ff; text-decoration: none; font-size: .9rem; }
  main { max-width: 1000px; margin: 0 auto; padding: 14px; }
  section { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  h2 { margin: 0 0 10px; font-size: 1rem; border-left: 4px solid #5b7cfa; padding-left: 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button, label.btn { background: #5b7cfa; color: #fff; border: 0; border-radius: 8px;
         padding: 9px 16px; font-size: .95rem; cursor: pointer; }
  button.gray { background: #8892a6; }
  button.red { background: #e05b5b; }
  input[type=file] { display: none; }
  #stage { position: relative; margin-top: 10px; touch-action: none; }
  #img { max-width: 100%; border-radius: 8px; display: block; }
  #canvas { position: absolute; left: 0; top: 0; }
  .hint { font-size: .8rem; color: #999; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px;
                border: 3px solid transparent; cursor: pointer; }
  .thumbs img.done { border-color: #38b26a; }
  .thumbs img.cur { border-color: #5b7cfa; }
  select, input[type=text] { padding: 8px; border-radius: 8px; border: 1px solid #ccc;
                             font-size: .95rem; }
  .objlist { margin-top: 8px; font-size: .85rem; }
  .objlist span { background: #e8ecff; border-radius: 16px; padding: 3px 10px;
                  margin: 2px; display: inline-block; }
</style>
</head>
<body>
<header>
  <b>✏️ 数据标注</b>
  <a href="/">← 返回首页</a>
</header>
<main>

  <section>
    <h2>1️⃣ 上传要标注的图片(建议每类 30 张以上)</h2>
    <div class="row">
      <label class="btn">添加图片(可多选)<input type="file" id="files" accept="image/*" multiple></label>
      <span id="upstat" class="hint"></span>
    </div>
    <div id="thumbs" class="thumbs"></div>
  </section>

  <section>
    <h2>2️⃣ 设置类别(逗号分隔,顺序即编号)</h2>
    <input type="text" id="classes" style="width:100%" placeholder="例如: cat,dog,cup">
    <button id="savecls" style="margin-top:8px">保存类别</button>
    <span id="clsstat" class="hint"></span>
  </section>

  <section>
    <h2>3️⃣ 画框 / 描多边形标注</h2>
    <p class="hint">分割测量需要<b>多边形标注</b>:选类别后沿物体边缘逐点点击,点完按「闭合多边形」。框模式只适合快速粗标。</p>
    <div class="row">
      <select id="mode"><option value="poly">🔷 多边形(推荐,可测面积/直径)</option><option value="rect">▭ 矩形框</option></select>
      <select id="curcls"></select>
      <button class="gray" id="undo">撤销</button>
      <button class="red" id="clear">清空本图</button>
      <button id="closePoly" style="display:none">闭合多边形 ✔</button>
      <button id="save" disabled>✔ 保存本图标注</button>
      <button class="gray" id="next" disabled>下一张 →</button>
    </div>
    <div id="stage">
      <img id="img" alt="先在上方选择一张图片">
      <canvas id="canvas"></canvas>
    </div>
    <div id="objlist" class="objlist"></div>
  </section>

</main>
<script>
/* ══════════ 标注页核心逻辑 ══════════
   两种标注模式(下拉切换):
     rect  按下拖动画框     → up 时存 {cls,x,y,w,h}
     poly  逐点点击描轮廓   → ≥3 点后「闭合多边形」存 {cls,poly:[[x,y],...]}
   后端统一把两种都写成 YOLO-seg 多边形格式(cls x1 y1 x2 y2 ...)

   事件模型(兼容平板触屏 + 电脑鼠标):
     rect: down 记起点 → move 预览 → up 定框
     poly: click 逐点加入;双击 = 闭合
     e.touches 存在说明是触屏事件,取第一个触点 */

let images = [];          // 所有已上传图片 [{name, labeled}]
let cur = -1;             // 当前编辑的图片下标
let shapes = [];          // 当前图的标注 {cls, x,y,w,h} 或 {cls, poly:[[x,y]...]}
let classes = [];         // 类别名列表,下标即类别编号
let drag = null;          // rect 拖动中的临时框
let curPoly = null;       // poly 进行中的临时多边形(点数组)

const $ = id => document.getElementById(id);

async function refresh() {
  const r = await fetch('/api/images'); const d = await r.json();
  images = d.images;
  const cls = await fetch('/api/classes'); classes = (await cls.json()).classes;
  $('classes').value = classes.join(',');
  renderThumbs(); renderClsSelect();
}

function renderThumbs() {
  $('thumbs').innerHTML = images.map((im, i) =>
    `<img src="/dataset/${im.name}" class="${im.labeled?'done':''} ${i===cur?'cur':''}"
          onclick="loadImg(${i})">`).join('');
}

function renderClsSelect() {
  $('curcls').innerHTML = classes.map(c => `<option>${c}</option>`).join('');
}

async function loadImg(i) {
  if (cur >= 0 && shapes.length && !confirm('切换图片将丢失未保存的标注,继续?')) return;
  cur = i; shapes = []; curPoly = null; drag = null;
  const img = $('img');
  img.src = '/dataset/' + images[i].name;
  await img.decode();
  const c = $('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.style.width = img.clientWidth + 'px'; c.style.height = img.clientHeight + 'px';
  // 回显:把这张图已保存的标注读回来画到画布上
  const lr = await fetch('/api/label/' + encodeURIComponent(images[i].name));
  shapes = (await lr.json()).shapes || [];
  draw(); renderThumbs();
  $('save').disabled = $('next').disabled = false;
}

function mode() { return $('mode').value; }

function draw() {
  const c = $('canvas'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const colors = ['#e05b5b','#38b26a','#5b7cfa','#d78f2b','#9b59b6','#2ba9a0'];
  const all = [...shapes];
  if (drag) all.push(drag);
  if (curPoly) all.push({cls: $('curcls').selectedIndex, poly: curPoly, preview: true});
  all.forEach(b => {
    const color = colors[((b.cls % colors.length) + colors.length) % colors.length];
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
    if (b.poly) {                                  // 多边形:描边 + 顶点圆点
      ctx.beginPath();
      b.poly.forEach((p, i) => i ? ctx.lineTo(p[0]*c.width, p[1]*c.height)
                                 : ctx.moveTo(p[0]*c.width, p[1]*c.height));
      if (!b.preview && b.poly.length >= 3) ctx.closePath();
      ctx.stroke();
      b.poly.forEach(p => { ctx.beginPath();
        ctx.arc(p[0]*c.width, p[1]*c.height, 5, 0, 7); ctx.fill(); });
    } else {                                       // 矩形框
      ctx.strokeRect(b.x*c.width, b.y*c.height, b.w*c.width, b.h*c.height);
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(classes[b.cls], b.x*c.width + 4, Math.max(30, b.y*c.height + 30));
    }
  });
  $('objlist').innerHTML = shapes.map(b =>
    `<span>${classes[b.cls]}</span>`).join('') || '<span class="hint">还没有标注</span>';
  $('closePoly').style.display =
    (mode() === 'poly' && curPoly && curPoly.length >= 3) ? '' : 'none';
}

function pos(e) {
  const r = $('canvas').getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height };
}

/* ── 矩形模式:按下拖动 ── */
function down(e) {
  if (mode() !== 'rect') return;                   // 多边形模式用 click,不走这里
  e.preventDefault();
  if (!classes.length) { alert('请先设置类别'); return; }
  const p = pos(e); drag = { x: p.x, y: p.y, w: 0, h: 0, cls: $('curcls').selectedIndex };
}
function move(e) { if (mode() !== 'rect' || !drag) return; e.preventDefault();
  const p = pos(e);
  drag.w = p.x - drag.x; drag.h = p.y - drag.h; draw();
}
function up() {
  if (mode() !== 'rect') return;
  if (!drag) return;
  if (Math.abs(drag.w) > 0.01 && Math.abs(drag.h) > 0.01) {
    shapes.push({ x: Math.min(drag.x, drag.x+drag.w), y: Math.min(drag.y, drag.y+drag.h),
                  w: Math.abs(drag.w), h: Math.abs(drag.h), cls: drag.cls });
  }
  drag = null; draw();
}

/* ── 多边形模式:逐点点击,≥3 点后闭合 ── */
function clickAdd(e) {
  if (mode() !== 'poly') return;
  if (!classes.length) { alert('请先设置类别'); return; }
  const p = pos(e);
  if (!curPoly) curPoly = [];
  curPoly.push([p.x, p.y]);
  draw();
}
function closePoly() {
  if (curPoly && curPoly.length >= 3)
    shapes.push({ cls: $('curcls').selectedIndex, poly: curPoly });
  curPoly = null; draw();
}

const c = $('canvas');
c.addEventListener('mousedown', down); c.addEventListener('mousemove', move);
c.addEventListener('mouseup', up);
c.addEventListener('touchstart', down, {passive:false});
c.addEventListener('touchmove', move, {passive:false});
c.addEventListener('touchend', up);
c.addEventListener('click', clickAdd);
c.addEventListener('dblclick', e => { e.preventDefault();
  if (mode() === 'poly' && curPoly) { curPoly.splice(-2); closePoly(); } });
$('closePoly').onclick = closePoly;
$('mode').onchange = draw;

$('undo').onclick = () => {
  if (curPoly && curPoly.length) curPoly.pop();  // 撤销当前多边形的最后一个点
  else shapes.pop();                             // 否则删除上一个完整标注
  draw();
};
$('clear').onclick = () => { shapes = []; curPoly = null; drag = null; draw(); };
$('next').onclick = () => { const n = images.findIndex((im,i)=>i>cur && !im.labeled);
  loadImg(n > 0 ? n : 0); };

$('files').onchange = async () => {
  const fd = new FormData();
  [...$('files').files].forEach(f => fd.append('files', f));
  $('upstat').textContent = '上传中...';
  const r = await fetch('/api/upload', { method: 'POST', body: fd });
  const d = await r.json();
  $('upstat').textContent = `已上传 ${d.saved} 张(重复 ${d.skipped})`;
  await refresh(); loadImg(images.length ? images.length - 1 : 0);
};

$('savecls').onclick = async () => {
  classes = $('classes').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  await fetch('/api/classes', { method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({classes}) });
  $('clsstat').textContent = '已保存:' + classes.join(', ');
  renderClsSelect();
};

$('save').onclick = async () => {
  if (cur < 0) return;
  if (curPoly && curPoly.length >= 3) {          // 有未闭合的多边形,保存前自动闭合
    shapes.push({ cls: $('curcls').selectedIndex, poly: curPoly }); curPoly = null;
  }
  await fetch('/api/label', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: images[cur].name, boxes: shapes }) });
  images[cur].labeled = shapes.length > 0;
  renderThumbs();
  alert('已保存 ' + shapes.length + ' 个标注');
};

refresh();
</script>
</body>
</html>
